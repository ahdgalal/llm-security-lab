[project]
name = "llm-security-lab"
version = "0.1.0"
description = "A small Python project that uses the OpenAI SDK to send prompts to an OpenAI model and compare responses at different temperature values."
readme = "README.md"
authors = [
    { name = "ahdgalal", email = "ahdgalal1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "python-dotenv>=1.2.4",
]
